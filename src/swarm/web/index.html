<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drone Duel COP</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238ab6c8'%3E%3Cg opacity='.55'%3E%3Ccircle cx='5' cy='5' r='4'/%3E%3Ccircle cx='19' cy='5' r='4'/%3E%3Ccircle cx='5' cy='19' r='4'/%3E%3Ccircle cx='19' cy='19' r='4'/%3E%3C/g%3E%3Cpath d='M4 5.4 5.4 4 20 18.6 18.6 20Z'/%3E%3Cpath d='M18.6 4 20 5.4 5.4 20 4 18.6Z'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5'/%3E%3C/svg%3E"
    />
    <script>
      window.CESIUM_BASE_URL = "/vendor/cesium/Build/Cesium/";
    </script>
    <script src="/vendor/cesium/Build/Cesium/Cesium.js"></script>
    <script src="/vendor/milsymbol/dist/milsymbol.js"></script>
    <script src="/vendor/mgrs/dist/mgrs.min.js"></script>
    <link rel="stylesheet" href="/vendor/cesium/Build/Cesium/Widgets/widgets.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="map"></div>

    <header id="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><g opacity=".55"><circle cx="5" cy="5" r="4"/><circle cx="19" cy="5" r="4"/><circle cx="5" cy="19" r="4"/><circle cx="19" cy="19" r="4"/></g><path d="M4 5.4 5.4 4 20 18.6 18.6 20Z"/><path d="M18.6 4 20 5.4 5.4 20 4 18.6Z"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>DRONE DUEL <b>COP</b>
      </div>
      <div class="chip" id="phase" title="Mission phase">—</div>
      <div class="spacer"></div>
      <div class="chip muted" id="source" title="Map source">—</div>
      <div class="chip" id="link"><span class="dot"></span><span id="link-text">CONNECTING</span></div>
      <div class="clock" id="clock">—</div>
    </header>

    <aside id="fleet" aria-label="Fleet">
      <div class="panel-title">FLEET <span id="fleet-count"></span>
        <button id="select-all" class="panel-action" data-action="selectAll" title="Select every drone (0)">ALL</button></div>
      <div id="cards"></div>
    </aside>

    <nav id="toolbar" aria-label="View">
      <div class="group">
        <button data-cycle="sensors" title="Camera field of view: selected drone, all, off (S)">Sensor</button>
        <button data-toggle="mission" title="Each drone's uploaded mission (M)">Mission</button>
        <button data-toggle="fence" title="Geofence of the selected drone (G)">Fence</button>
        <button data-toggle="trails" title="Flight trails">Trails</button>
        <button data-toggle="slots" title="Formation and hold slots">Slots</button>
        <button data-toggle="controlArea" title="Leader's control area: armed followers inside it lift off (K)">Control</button>
        <button data-toggle="labels" title="Symbols and labels (L)">Labels</button>
        <button data-toggle="rangeBearing" title="Range and bearing to point B (R)">R&amp;B</button>
        <button data-action="imagery" id="imagery-btn" title="Satellite or streets">Satellite</button>
      </div>
      <div class="group">
        <button data-action="auto" title="Auto camera: chase the leader, orbit when holding (A)">Auto</button>
        <button data-action="overview" title="Frame the whole swarm (O)">Overview</button>
        <button data-action="top" title="Top-down (T)">Top</button>
        <button data-action="follow" title="Chase the selected drone (F)">Follow</button>
        <button data-action="fpv" title="The map from the selected drone, on its telemetry (V)">FPV</button>
        <span class="sensor-controls" id="sensor-controls">
          <label title="Camera angle up from the drone's nose">Tilt <input type="range" id="tilt" min="-90" max="45" step="1" /><output id="tilt-out"></output></label>
          <label>FOV <input type="range" id="fov" min="30" max="120" step="1" /><output id="fov-out"></output></label>
        </span>
      </div>
      <div class="group">
        <button data-action="camera" title="The selected drone's camera feed: in the sim, every drone where it really is (C)">Camera feed</button>
      </div>
    </nav>

    <button id="compass" title="North up">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" />
        <path class="needle-n" d="M20 5 L25 20 L15 20 Z" />
        <path class="needle-s" d="M20 35 L25 20 L15 20 Z" />
        <text x="20" y="4.2">N</text>
      </svg>
    </button>

    <div id="fpv" hidden>
      <canvas id="osd"></canvas>
      <div class="fpv-frame"><span></span><span></span><span></span><span></span></div>
      <div class="fpv-cross"></div>
      <div class="fpv-top"><span id="fpv-callsign"></span><span class="rec">● REC</span><span id="fpv-time"></span></div>
      <div class="fpv-left"><div>ALT</div><b id="fpv-alt"></b><div>m AGL</div></div>
      <div class="fpv-right"><div>SPD</div><b id="fpv-spd"></b><div>m/s</div></div>
      <div class="fpv-bottom"><span id="fpv-hdg"></span><span id="fpv-mode"></span><span id="fpv-cam"></span></div>
      <button class="fpv-exit" id="fpv-exit" data-action="exit">Exit FPV (Esc)</button>
    </div>

    <footer id="status">
      <span id="cursor-mgrs" title="Cursor position (MGRS)">MGRS —</span>
      <span id="cursor-ll"></span>
      <span id="cursor-elev"></span>
    </footer>

    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
