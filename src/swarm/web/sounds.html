<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drone Duel Sounds</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238ab6c8'%3E%3Cg opacity='.55'%3E%3Ccircle cx='5' cy='5' r='4'/%3E%3Ccircle cx='19' cy='5' r='4'/%3E%3Ccircle cx='5' cy='19' r='4'/%3E%3Ccircle cx='19' cy='19' r='4'/%3E%3C/g%3E%3Cpath d='M4 5.4 5.4 4 20 18.6 18.6 20Z'/%3E%3Cpath d='M18.6 4 20 5.4 5.4 20 4 18.6Z'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
    <style>
      html,
      body {
        height: auto;
        min-height: 100%;
        overflow: auto;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 16px 48px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.08em;
        color: var(--brand);
      }
      h1 b {
        color: var(--text);
      }
      .lede {
        color: var(--muted);
        margin: 6px 0 18px;
        max-width: 70ch;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 18px;
        padding: 10px 12px;
        margin-bottom: 18px;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 9px;
        position: sticky;
        top: 8px;
        z-index: 2;
        backdrop-filter: blur(6px);
      }
      .bar label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      .bar input[type="range"] {
        width: 160px;
        accent-color: var(--accent);
      }
      .bar output {
        font-family: var(--mono);
        color: var(--text);
        min-width: 3ch;
      }
      .bar .spacer {
        flex: 1;
      }
      .btn {
        border: 1px solid var(--panel-edge);
        background: rgba(255, 255, 255, 0.05);
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        letter-spacing: 0.03em;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .btn.on {
        background: rgba(127, 227, 255, 0.16);
        border-color: rgba(127, 227, 255, 0.4);
        color: var(--accent);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 12px;
      }
      .sound-card {
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 9px;
        padding: 12px 14px 14px;
        transition: border-color 0.2s;
      }
      .sound-card.playing {
        border-color: rgba(127, 227, 255, 0.5);
      }
      .sound-card h2 {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .sound-card p {
        margin: 4px 0 10px;
        color: var(--muted);
        min-height: 2.7em;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--panel-edge);
        background: rgba(255, 255, 255, 0.04);
        padding: 5px 10px 5px 8px;
        border-radius: 999px;
        cursor: pointer;
      }
      .chip-btn:hover {
        background: rgba(255, 255, 255, 0.09);
      }
      .chip-btn::before {
        content: "▶";
        font-size: 9px;
        color: var(--muted);
      }
      .chip-btn.off::before {
        content: "✕";
      }
      .chip-btn.chosen {
        background: rgba(127, 227, 255, 0.16);
        border-color: rgba(127, 227, 255, 0.5);
        color: var(--accent);
      }
      .chip-btn.chosen::before {
        color: var(--accent);
      }
      .chip-btn small {
        color: var(--muted);
        font-size: 10px;
      }
      .hint {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .hint kbd {
        font-family: var(--mono);
        border: 1px solid var(--panel-edge);
        border-radius: 4px;
        padding: 0 4px;
        color: var(--text);
      }
      .meter {
        font-family: var(--mono);
        color: var(--accent);
      }
      .off-note {
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DRONE DUEL <b>SOUNDS</b></h1>
      <p class="lede">
        Click a variant to hear it and choose it. Your choices are saved in this browser and the
        COP and the drive page use them straight away, open or not. Every sound can be off.
      </p>
      <div class="bar">
        <button class="btn" id="enabled" title="Game sound on or off (the previews here play either way)">Sound on</button>
        <label>Volume <input type="range" id="volume" min="0" max="100" step="1" /><output id="volume-out"></output></label>
        <span class="off-note" id="off-note" hidden>Sound is off in the game</span>
        <span class="spacer"></span>
        <button class="btn" id="play-turn" title="Your chosen sounds, as in a turn">Hear a turn</button>
        <button class="btn" id="reset" title="Every sound back to its default">Defaults</button>
      </div>
      <div class="grid" id="cards"></div>
    </main>
    <script type="module" src="/soundlab.js"></script>
  </body>
</html>
