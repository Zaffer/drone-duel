# Mission settings. Each swarm command reads this file when it starts.
# After a change, restart the command. To use a different file: --settings PATH.
# A command-line flag overrides a setting for one run only.

[mission]  # Sim and real drones.
point_a = [45.319287, -75.758596]      # Hold point [lat, lon]. The swarm flies here in formation and holds.
point_b = [45.319385, -75.759046]      # Target [lat, lon]. The pilot flies each drone here and lands it.
copters = 5                            # Number of drones, with the leader. Their system IDs are 1 to this number.

[swarm]  # Sim and real drones. Adjust these on the day.
follower_distance_m = 5.0              # Horizontal distance from each follower to the leader.
follower_height_step_m = 1.5           # Height difference between followers. The leader is lowest, the first follower one step above it.
liftoff_max_leader_distance_m = 100.0  # A follower lifts off only this near the leader. The viewer shows this ring (K).
liftoff_min_leader_height_m = 5.0      # A follower lifts off only when the leader is this high.
follow_max_distance_m = 150.0          # Farther from the leader than this, a follower stops and holds. Must be more than liftoff_max_leader_distance_m.
landing_zone_radius_m = 25.0           # Landing zone around point B. The viewer shows this ring.

[fence]  # Sim and real drones. The stack uploads it to every drone. Each drone checks it on board.
enabled = true                         # false: the stack turns the fence off on every drone.
corners = [                            # Polygon the drones must stay inside: [lat, lon], 3 or more, in order around.
  [45.32225, -75.76260],
  [45.32225, -75.75500],
  [45.31685, -75.75500],
  [45.31685, -75.76260],
]
max_height_m = 100.0                   # Ceiling, metres above the takeoff point. 10 to 1000.
action = "brake"                       # At the fence: "brake" (stop and hover), "rtl" (fly home), "land", "report" (warn only).

[sim]  # Sim only. Real drones start where they stand.
home = [45.319821, -75.758630]         # Start point of drone 1 [lat, lon].
ground_alt_m = 77.0                    # Ground height at home, metres above sea level. "auto" gets it from the internet.
spawn_spacing_m = 5.0                  # Distance between drones at the start. They stand in a line to the east.
router = "sitl"                        # "sitl": simulated drones. "field": UDP, the same as the real drones.
wind_speed_ms = 0.0                    # Wind speed, m/s.
wind_from_deg = 180.0                  # Wind direction, degrees true: where the wind comes from.
wind_turbulence_ms = 0.0               # Gusts, m/s.
vtx_mw = 25.0                          # Camera feed: the video transmitter's power, mW (25 to 800). Farther from takeoff, the analog picture gets noisier.
