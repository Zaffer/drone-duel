# mavlink-router for ArduCopter SITL (DESIGN.md §3): one vehicle, SITL's SERIAL0 on TCP
# 5760 + 10 x slot (drone_duels.ports), shared out to
#   QGroundControl (system 255) on UDP 14550, its autoconnect port, and
#   the game (system 254) on UDP 14570: the game sends first, the router answers it there.
# drone_duels.firmware.ardupilot writes this into each spawn's directory with the slot's
# TCP port in place of 5760. TcpServerPort 0: the router's own TCP server would take 5760.

[General]
TcpServerPort = 0
DebugLogLevel = info

[TcpEndpoint copter]
Address = 127.0.0.1
Port = 5760

[UdpEndpoint qgc]
Mode = Normal
Address = 127.0.0.1
Port = 14550

[UdpEndpoint game]
Mode = Server
Address = 127.0.0.1
Port = 14570
