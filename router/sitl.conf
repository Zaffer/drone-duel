# mavlink-router configuration for the SITL swarm.
# Vehicles: one TCP client per SITL instance (serial0 = tcp:5760 + 10*i).
# Clients:  QGroundControl on UDP 14550 (its autoconnect port),
#           the watcher (3D viewer telemetry) on UDP server 14560,
#           swarm pilot on UDP server 14570.
# The field laptop uses router/field.conf with the same client endpoints.

[General]
TcpServerPort = 0
DebugLogLevel = info

[TcpEndpoint copter1]
Address = 127.0.0.1
Port = 5760

[TcpEndpoint copter2]
Address = 127.0.0.1
Port = 5770

[TcpEndpoint copter3]
Address = 127.0.0.1
Port = 5780

[TcpEndpoint copter4]
Address = 127.0.0.1
Port = 5790

[TcpEndpoint copter5]
Address = 127.0.0.1
Port = 5800

[UdpEndpoint qgc]
Mode = Normal
Address = 127.0.0.1
Port = 14550

[UdpEndpoint watcher]
Mode = Server
Address = 127.0.0.1
Port = 14560

# swarm pilot (radio, switch panel, launcher), or another tool such as MAVProxy.
[UdpEndpoint tools]
Mode = Server
Address = 127.0.0.1
Port = 14570
