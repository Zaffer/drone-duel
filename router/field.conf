# mavlink-router configuration for the field laptop.
# Drone N's Wi-Fi MAVLink bridge sends to this laptop on UDP 14550 + N (14551 to 14555): one
# endpoint per drone. A UDP server endpoint answers only the last address that sent to it, and
# the router never forwards a message to the endpoint its sender is on, so drones sharing one
# endpoint would miss most commands and never hear each other's positions, which ArduPilot
# FOLLOW and avoidance need.
# QGroundControl, the watcher and swarm pilot connect exactly as in SITL.

[General]
TcpServerPort = 0
Log = logs/router
LogMode = while-armed

[UdpEndpoint drone1]
Mode = Server
Address = 0.0.0.0
Port = 14551

[UdpEndpoint drone2]
Mode = Server
Address = 0.0.0.0
Port = 14552

[UdpEndpoint drone3]
Mode = Server
Address = 0.0.0.0
Port = 14553

[UdpEndpoint drone4]
Mode = Server
Address = 0.0.0.0
Port = 14554

[UdpEndpoint drone5]
Mode = Server
Address = 0.0.0.0
Port = 14555

[UdpEndpoint qgc]
Mode = Normal
Address = 127.0.0.1
Port = 14550

[UdpEndpoint watcher]
Mode = Server
Address = 127.0.0.1
Port = 14560

[UdpEndpoint tools]
Mode = Server
Address = 127.0.0.1
Port = 14570
